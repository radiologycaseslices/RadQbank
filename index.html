<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fellowship MCQs</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f5c63"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#eef1f3;--c:#fff;--t:#14191f;--m:#5f6b76;--p:#0f5c63;--g:#15803d;--r:#b91c1c;--pb:#fff4d6;--pt:#4a3500;--b:#d5dbe0}
@media(prefers-color-scheme:dark){:root{--bg:#0d1215;--c:#161d22;--t:#e6ebef;--m:#93a0ab;--g:#4ade80;--r:#f87171;--pb:#2b2410;--pt:#f3e3b0;--b:#28333b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 Georgia,serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:auto;padding:14px}h1{font-size:22px;margin:8px 0}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:10px 0}
button{font:inherit;color:inherit;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;width:100%;text-align:left;margin:5px 0}
.pri{background:var(--p);color:#fff;border:0;text-align:center;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.row button{width:auto}
small,.m{color:var(--m);font-size:13px;font-family:system-ui,sans-serif}
.pearl{background:var(--pb);color:var(--pt);border-left:4px solid #d9a000;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.bar{height:5px;background:var(--b);border-radius:3px}.bar i{display:block;height:5px;background:var(--p);border-radius:3px}
button:focus-visible{outline:3px solid var(--p)}
</style></head><body><main id="app"></main>
<script>
const B=['questions.json'],DAY=864e5,IV=[0,1,3,7,14];let Q=[],L=[],i=0,done=0;
const ld=()=>{try{return JSON.parse(localStorage.fm)||{}}catch(e){return{}}};let S=ld();S.s=S.s||{};S.f=S.f||[];
const sv=()=>{try{localStorage.fm=JSON.stringify(S)}catch(e){}},app=document.getElementById('app'),sh=a=>a.sort(()=>Math.random()-.5);
async function init(){Q=(await Promise.all(B.map(f=>fetch(f).then(r=>r.json()).catch(()=>[])))).flat();home()}
function home(){const now=Date.now(),e=Q.map(q=>S.s[q.id]).filter(Boolean),n=e.reduce((x,s)=>x+s.c+s.w,0),c=e.reduce((x,s)=>x+s.c,0),due=Q.filter(q=>S.s[q.id]&&S.s[q.id].d<=now).length,T={};
Q.forEach(q=>{const t=T[q.t]=T[q.t]||{n:0,s:0,c:0,w:0},s=S.s[q.id];t.n++;if(s){t.s++;t.c+=s.c;t.w+=s.w}});
const wr=Q.filter(q=>S.s[q.id]&&S.s[q.id].k==0).length;
app.innerHTML=`<h1>Fellowship MCQs</h1><div class=m>${Q.length} questions · ${n?Math.round(100*c/n)+'% correct':'not started'} · ${due} due</div>
<button class=pri onclick="go('today')">Today's 20</button><button onclick="go('m')">Mixed bag: 30 random from all topics</button>
<div class=card><b>By topic</b>${Object.keys(T).map(k=>{const t=T[k],a=t.c+t.w;return`<button onclick="go('t','${k}')"><div class=row><span>${k}</span><small>${t.s}/${t.n} seen${a?' · '+Math.round(100*t.c/a)+'%':''}</small></div><div class=bar><i style="width:${100*t.s/t.n}%"></i></div></button>`}).join('')}</div>
<div class=card><b>Review</b><button onclick="go('w')">Missed questions (${wr})</button><button onclick="go('f')">Flagged (${S.f.length})</button></div>
<div class=card><b>Backup</b><button onclick="dl('progress.json',S)">Export progress</button><button onclick="document.getElementById('imp').click()">Import progress</button><button onclick="dl('flagged.json',Q.filter(q=>S.f.includes(q.id)))">Export flagged questions</button><input id=imp type=file hidden onchange="imp(this)"></div>`}
function go(m,t){const now=Date.now(),s=q=>S.s[q.id];let l;
if(m=='today'){const d=Q.filter(q=>s(q)&&s(q).d<=now),nw=sh(Q.filter(q=>!s(q)));l=sh(d).concat(nw).slice(0,20)}
else if(m=='m')l=sh(Q.slice()).slice(0,30);else if(m=='t')l=sh(Q.filter(q=>q.t==t));else if(m=='w')l=Q.filter(q=>s(q)&&s(q).k==0);else l=Q.filter(q=>S.f.includes(q.id));
if(!l.length){alert('Nothing here yet.');return}L=l;i=0;show()}
function show(){if(i>=L.length){home();return}done=0;const q=L[i];
app.innerHTML=`<div class=row><button onclick=home()>Exit</button><span class=m>${i+1} of ${L.length}</span></div><div class=card><small>${q.t} · ${['Easy','Medium','Hard'][q.d-1]}</small><p><b>${q.q}</b></p><div id=o>${q.o.map((x,j)=>`<button onclick=ans(${j})>${'ABCD'[j]}. ${x}</button>`).join('')}</div><div id=x></div></div>`}
function ans(j){if(done)return;done=1;const q=L[i],ok=j==q.a,s=S.s[q.id]=S.s[q.id]||{k:0,d:0,c:0,w:0};
if(ok){s.c++;s.k=Math.min(s.k+1,4)}else{s.w++;s.k=0}s.d=Date.now()+IV[s.k]*DAY;sv();
[...document.getElementById('o').children].forEach((b,k)=>{b.disabled=1;if(k==q.a)b.style.borderColor='var(--g)';else if(k==j)b.style.borderColor='var(--r)'});
document.getElementById('x').innerHTML=`<p style="color:var(${ok?'--g':'--r'})"><b>${ok?'Correct':'Answer: '+'ABCD'[q.a]}</b></p><p>${q.e}</p><div class=pearl><b>Pearl</b><br>${q.p}</div><small>Ref: ${q.r}</small><button onclick=fl(this)>${S.f.includes(q.id)?'Unflag':'Flag as wrong or unclear'}</button><button class=pri onclick="i++;show()">Next</button>`}
function fl(b){const id=L[i].id,k=S.f.indexOf(id);k<0?S.f.push(id):S.f.splice(k,1);sv();b.textContent=k<0?'Unflag':'Flag as wrong or unclear'}
function dl(n,o){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download=n;a.click()}
function imp(el){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);S={s:o.s||{},f:o.f||[]};sv();home()}catch(e){alert('Not a valid progress file.')}};r.readAsText(el.files[0])}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');init();
</script></body></html>
